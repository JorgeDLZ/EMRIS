{% extends "base.html" %}

{% block title %}EMRIS — Change role{% endblock %}

{% block content %}
  <div class="page-header">
    <h1>Change role for {{ target.username }}</h1>
  </div>
  <form method="post" class="card">
    {% csrf_token %}
    {% include "_form_fields.html" %}
    <div class="form-card-actions">
      <button type="submit" class="btn btn-primary">Save role</button>
      <a href="{% url 'accounts:user_list' %}">Back to users</a>
    </div>
  </form>
{% endblock %}
