{% extends "base.html" %}

{% block title %}EMRIS — Change role{% endblock %}

{% block content %}
  <h1>Change role for {{ target.username }}</h1>
  <form method="post" class="card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save role</button>
  </form>
  <p><a href="{% url 'accounts:user_list' %}">Back to users</a></p>
{% endblock %}
