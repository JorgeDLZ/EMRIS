{% extends "base.html" %}

{% block title %}EMRIS — Register{% endblock %}

{% block content %}
  <h1>Register</h1>
  <form method="post" class="card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create account</button>
  </form>
  <p>Already registered? <a href="{% url 'accounts:login' %}">Log in</a></p>
{% endblock %}
