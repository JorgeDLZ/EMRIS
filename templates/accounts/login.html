{% extends "base.html" %}

{% block title %}EMRIS — Log in{% endblock %}

{% block content %}
  <h1>Log in</h1>
  <form method="post" class="card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
  </form>
  <p>No account yet? <a href="{% url 'accounts:register' %}">Register</a></p>
{% endblock %}
